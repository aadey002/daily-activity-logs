name: Daily Activity Summary

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate daily activity summary
        env:
          GH_TOKEN: ${{ secrets.ACTIVITY_PAT }}
        shell: bash
        run: |
          set -e

          SUMMARY_DATE=$(date -u -d "yesterday" +%Y-%m-%d)
          FILENAME=$(date -u -d "yesterday" +%m%d%y)_Activity_Summary.md
          DISPLAY_DATE=$(date -u -d "yesterday" +"%B %d, %Y")
          SINCE="${SUMMARY_DATE}T00:00:00Z"
          UNTIL=$(date -u +%Y-%m-%dT00:00:00Z)

          REPOS=(
            "aadey002/grant-reviewer-alert-system"
            "aadey002/ache-study-smart"
            "aadey002/quantum-marketing-hub"
            "aadey002/onboardeq"
            "aadey002/thc-board-intelligence"
            "aadey002/hrsa-osv-assistant"
            "aadey002/truereach-app"
            "aadey002/thc-training-portal"
            "aadey002/pastor-bailey-bible-study"
            "aadey002/MPJE"
            "aadey002/Stock-agent-"
            "aadey002/daily-activity-logs"
          )

          TOTAL_COMMITS=0
          TMPFILE=$(mktemp)

          for REPO in "${REPOS[@]}"; do
            REPO_NAME=$(echo "$REPO" | cut -d'/' -f2)

            COMMITS=$(gh api "repos/${REPO}/commits?since=${SINCE}&until=${UNTIL}&per_page=100" \
              --jq '.[] | "| `" + (.sha[:7]) + "` | " + (.commit.message | split("\n")[0]) + " |"' \
              2>/dev/null || true)

            if [ -n "$COMMITS" ]; then
              COUNT=$(echo "$COMMITS" | wc -l)
              TOTAL_COMMITS=$((TOTAL_COMMITS + COUNT))
              {
                echo ""
                echo "## ${REPO_NAME}"
                echo ""
                echo "Commits: ${COUNT}"
                echo ""
                echo "| Commit | Message |"
                echo "|--------|---------|"
                echo "$COMMITS"
              } >> "$TMPFILE"
            fi
          done

          if [ "$TOTAL_COMMITS" -eq 0 ]; then
            echo "No commits found for ${SUMMARY_DATE}. Skipping."
            rm -f "$TMPFILE"
            exit 0
          fi

          ACTIVE_REPOS=$(grep -c "^## " "$TMPFILE" || true)

          {
            echo "# Activity Summary - ${DISPLAY_DATE}"
            echo ""
            echo "Total Commits: ${TOTAL_COMMITS}"
            echo "Repos with Activity: ${ACTIVE_REPOS}"
            echo ""
            echo "---"
            cat "$TMPFILE"
            echo ""
            echo "---"
            echo ""
            echo "Generated automatically at $(date -u +'%Y-%m-%d %H:%M UTC')"
          } > "${FILENAME}"

          rm -f "$TMPFILE"
          echo "Generated ${FILENAME} with ${TOTAL_COMMITS} commits"

      - name: Commit and push
        run: |
          FILENAME=$(date -u -d "yesterday" +%m%d%y)_Activity_Summary.md
          if [ ! -f "$FILENAME" ]; then
            echo "No summary file generated. Skipping commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${FILENAME}"
          git commit -m "docs: $(date -u -d 'yesterday' +%m%d%y) activity summary"
          git push
